{% extends "layouts/base.html" %}
{% block title %}Connexion — SenGestion{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-brand">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SenGestion" class="auth-logo">
    </div>

    <h1 class="auth-title">Connexion</h1>
    <p class="auth-sub">Accédez à votre espace de gestion</p>

    <form method="POST" action="{{ url_for('auth.login') }}" style="margin-top:28px;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-input" type="email" id="email" name="email"
               required autocomplete="email" placeholder="vous@entreprise.sn">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <input class="form-input" type="password" id="password" name="password"
               required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-accent btn-block" style="margin-top:8px;">
        Se connecter
      </button>
    </form>

    <p class="auth-alt">Pas encore de compte ?
      <a href="{{ url_for('auth.register') }}">Créer un compte</a>
    </p>

  </div>
</div>
{% endblock %}
